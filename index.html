  a.src{color:#1565c0;text-decoration:none;font-size:12px;white-space:nowrap}

// distinct categorical hues so doughnut segments are easy to tell apart
const PALETTE = ['#2e7d32','#1565c0','#ef6c00','#6a1b9a','#c62828','#00838f','#f9a825','#5e35b1','#ad1457','#00897b'];
let activeMsa = 'All';
let charts = [];

const count = arr => arr.reduce((m,k)=>{ if(k){m[k]=(m[k]||0)+1} return m }, {});
const msaRows = () => activeMsa==='All' ? D.rows : D.rows.filter(r=>r.msa===activeMsa);

function stats(rows){
  return {
    count: rows.length,
    nMsas: new Set(rows.map(r=>r.msa)).size,
    recurring: rows.filter(r=>r.recurring).length,
    free: rows.filter(r=>r.free).length,
    totalLikes: rows.reduce((s,r)=>s+(r.likes||0),0),
    byType: count(rows.map(r=>r.type)),
    byMsa: count(rows.map(r=>r.msa)),
    byMonth: Object.fromEntries(Object.entries(count(rows.map(r=>r.month).filter(Boolean))).sort()),
    byAudience: count(rows.map(r=>r.audience)),
  };
}

function renderCards(s){
  const cards=[['Events',s.count],['MSAs',s.nMsas],['Recurring',s.recurring],['Free',s.free],['Total likes',s.totalLikes.toLocaleString()]];
  document.getElementById('cards').innerHTML = cards.map(c=>`<div class="card"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
}

function dough(id,obj){return new Chart(document.getElementById(id),{type:'doughnut',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:PALETTE}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:11,font:{size:11}}}}}});}
function bars(id,obj){return new Chart(document.getElementById(id),{type:'bar',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:'#2e7d32'}]},options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}}}});}
function lines(id,obj){return new Chart(document.getElementById(id),{type:'line',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),borderColor:'#2e7d32',backgroundColor:'rgba(46,125,50,.15)',fill:true,tension:.3}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}});}

function renderCharts(s){
  charts.forEach(c=>c.destroy()); charts=[];
  charts.push(dough('types',s.byType), bars('msas',s.byMsa), lines('months',s.byMonth), dough('aud',s.byAudience));
}

function rowHtml(r){
  const img = r.img ? `<img class="thumb" src="${r.img}" loading="lazy">` : '<div class="thumb"></div>';
  const rec = r.recurring ? ' <span class="rec">↻</span>' : '';
  const likes = r.likes==null ? '—' : r.likes;
  const src = r.url ? `<a class="src" href="${r.url}" target="_blank" rel="noopener">view post ↗</a>` : '—';
  return `<tr><td>${img}</td><td>${r.title}${rec}</td><td>${r.msa}</td><td><span class="badge">${r.type}</span></td><td>${r.date||'—'}</td><td>${likes}</td><td>${src}</td></tr>`;
}
function renderTable(rows){document.getElementById('rows').innerHTML = rows.map(rowHtml).join('')}

function textFiltered(rows){
  const q=document.getElementById('q').value.toLowerCase();
  return q ? rows.filter(r=>(r.title+' '+r.msa+' '+r.type).toLowerCase().includes(q)) : rows;
}

function renderAll(){                 // on MSA change: cards + charts + table
  const rows = msaRows();
  const s = stats(rows);
  renderCards(s); renderCharts(s); renderTable(textFiltered(rows));
  document.getElementById('tabletitle').firstChild.textContent =
    (activeMsa==='All' ? 'Events ' : activeMsa+' events ');
}
function onSearch(){ renderTable(textFiltered(msaRows())) }   // on typing: table only (fast)

document.getElementById('meta').textContent = `${D.rows.length} events across ${D.msas.length} MSAs`;
const bar = document.getElementById('filters');
['All', ...D.msas].forEach(name=>{
  const b=document.createElement('button');
  b.className='chip'; b.textContent=name;
  b.onclick=()=>selectMsa(name);
  bar.appendChild(b);
});

// Each MSA is a bookmarkable "page" via the URL hash (#<MSA>), with back/forward.
function selectMsa(name, updateHash=true){
  activeMsa = name;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.textContent===name));
  if(updateHash){ const h = name==='All' ? ' ' : '#'+encodeURIComponent(name);
    history.pushState(null,'', name==='All' ? location.pathname : h); }
  document.title = (name==='All'?'State of MSAs':name) + ' — Dashboard';
  renderAll();
}
function fromHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  selectMsa(D.msas.includes(h) ? h : 'All', false);
}
if(!D.rows.some(r=>r.img)) document.querySelector('table').classList.add('no-flyer');
window.addEventListener('popstate', fromHash);
fromHash();
</script></body></html>
